<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌 × 全平台热点借势看板</title>
<style>
  :root{--ink:#1c1917;--paper:#faf7f2;--line:#e4ddd2;--gold:#b08d3e;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Noto Serif SC","Songti SC","SimSun",serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:760px;width:100%;}
  h1{font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:2px;margin-bottom:8px;}
  .sub{color:#6b655c;font-size:14px;letter-spacing:1px;margin-bottom:40px;border-bottom:1px solid var(--line);padding-bottom:20px;}
  .card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px 30px;margin-bottom:20px;transition:box-shadow .18s ease,transform .18s ease;}
  .card:hover{box-shadow:0 10px 28px rgba(28,25,23,.10);transform:translateY(-2px);}
  .brand{font-size:19px;font-weight:700;letter-spacing:1px;margin-bottom:6px;}
  .desc{font-size:13px;color:#6b655c;line-height:1.7;}
  .tag{display:inline-block;margin-top:12px;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:3px 12px;letter-spacing:1px;}
  .foot{margin-top:32px;font-size:12px;color:#9b948a;text-align:center;letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>品牌 × 全平台热点借势看板</h1>
  <div class="sub">抖音 · 小红书 · 微博 每日 10:00 更新</div>

  <a class="card" href="ralph-lauren/">
    <div class="brand">RALPH LAUREN 拉夫劳伦</div>
    <div class="desc">永不过时的经典 —— 男装/女装 全平台热点 × 借势建议</div>
    <span class="tag">进入看板</span>
  </a>

  <a class="card" href="victorias-secret/">
    <div class="brand">VICTORIA'S SECRET 维多利亚的秘密</div>
    <div class="desc">性感自信 · 闪耀如你 —— 睡衣 / 水钻内衣 / 三角杯 热点 × 借势建议</div>
    <span class="tag">进入看板</span>
  </a>

  <div class="foot">数据源：抖音热榜 / 小红书热搜 / 微博热搜 · 借势建议需运营与合规审核</div>
</div>
</body>
</html>
